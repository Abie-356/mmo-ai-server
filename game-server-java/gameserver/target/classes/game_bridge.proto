syntax = "proto3";

// This makes sure Java puts the generated files in the right package later
option java_package = "com.mmo.grpc";
option java_outer_classname = "GameBridgeProto";

package mmo;

// The Java server sends this to the Python AI
message GameState {
  string player_id = 1;
  float player_x = 2;
  float player_y = 3;
  string action = 4;
}

// The Python AI replies with this
message BotScript {
  string bot_id = 1;
  string generated_command = 2;
}

// The actual service connection (The Bridge)
service AIEngine {
  rpc SendState (GameState) returns (BotScript);
}